LABEL arch
TEXT HELP
Boot the Tinfoil Hat Linux II install medium on BIOS.
It allows you to install Tinfoil Hat Linux II or perform system maintenance.
ENDTEXT
MENU LABEL Tinfoil Hat Linux II install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-hardened
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-hardened.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Tinfoil Hat Linux II install medium on BIOS with speakup screen reader.
It allows you to install Tinfoil Hat Linux II or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Tinfoil Hat Linux II install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-hardened
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-hardened.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
