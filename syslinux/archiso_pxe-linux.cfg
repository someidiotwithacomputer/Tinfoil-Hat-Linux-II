LABEL arch_nbd
TEXT HELP
Boot the Tinfoil Hat Linux II install medium using NBD.
It allows you to install Tinfoil Hat Linux II or perform system maintenance.
ENDTEXT
MENU LABEL Tinfoil Hat Linux II install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-hardened
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-hardened.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y
SYSAPPEND 3

