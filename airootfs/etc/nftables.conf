#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Loopback always allowed
        iif "lo" accept

        # Allow established/related connections back in
        ct state established,related accept

        # Drop invalid packets outright
        ct state invalid drop

        # Allow ICMP/ICMPv6 (ping, path MTU discovery, etc.)
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # Allow DHCP client replies
        udp sport 67 udp dport 68 accept

        # Uncomment if you want SSH access to this box
        # tcp dport 22 accept

        # Everything else inbound is dropped by default policy
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
        # Outbound is allowed by default — this is a workstation, not a firewall appliance.
        # Tighten this later if you want strict outbound allow-listing too.
    }
}
